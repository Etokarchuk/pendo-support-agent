<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Acme Support Assistant (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #2a2e38;
    --text: #e6e8ec;
    --text-dim: #9aa1ad;
    --accent: #6ea8fe;
    --answered: #3fb984;
    --clarify: #e0b23f;
    --escalate: #e0663f;
    --scope: #8a8f99;
    --caveat-bg: #3a2e17;
    --caveat-border: #e0b23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 0 2px; }
  header p { font-size: 12px; color: var(--text-dim); margin: 0; }
  header .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: #2a2e38;
    color: var(--text-dim);
    margin-left: 6px;
  }
  #examples {
    padding: 8px 20px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  #examples button {
    font-size: 11px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 12px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #examples button:hover { color: var(--text); border-color: var(--accent); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { max-width: 720px; }
  .msg.user { align-self: flex-end; }
  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .user .bubble { background: var(--accent); color: #0f1115; }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--panel-border); }
  .outcome-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .outcome-answered { background: #14301f; color: var(--answered); }
  .outcome-needs_clarification { background: #332a10; color: var(--clarify); }
  .outcome-escalate { background: #331910; color: var(--escalate); }
  .outcome-out_of_scope { background: #24262b; color: var(--scope); }
  details.evidence {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  details.evidence summary { cursor: pointer; color: var(--accent); }
  details.evidence ul { margin: 6px 0 0; padding-left: 18px; }
  .caveats {
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--caveat-bg);
    border-left: 3px solid var(--caveat-border);
    border-radius: 4px;
    font-size: 12px;
  }
  .caveats .label { font-weight: 600; color: var(--caveat-border); display: block; margin-bottom: 3px; }
  .escalation-card {
    margin-top: 10px;
    padding: 10px 12px;
    background: #1b1410;
    border: 1px solid var(--escalate);
    border-radius: 6px;
    font-size: 12px;
  }
  .escalation-card h4 { margin: 0 0 6px; color: var(--escalate); font-size: 12px; }
  .escalation-card dl { margin: 0; }
  .escalation-card dt { color: var(--text-dim); margin-top: 6px; }
  .escalation-card dd { margin: 2px 0 0; }
  .escalation-card button {
    margin-top: 10px;
    background: var(--escalate);
    color: #1b1410;
    border: none;
    border-radius: 5px;
    padding: 6px 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 12px;
  }
  .escalation-card button:disabled { opacity: 0.6; cursor: default; }
  .ticket-confirm { margin-top: 8px; color: var(--answered); font-weight: 600; }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--panel-border);
    background: var(--panel);
  }
  #inputRow input {
    flex: 1;
    background: #0f1115;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  #inputRow button {
    background: var(--accent);
    border: none;
    color: #0f1115;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  #inputRow button:disabled { opacity: 0.5; cursor: default; }
  .thinking { color: var(--text-dim); font-style: italic; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Acme Support Assistant <span class="badge">prototype</span></h1>
    <p>Diagnoses why in-app guides aren't showing. All account data below is simulated, modeled on Pendo's concepts — not a real Pendo account. See README.</p>
  </header>
  <div id="examples"></div>
  <div id="chat"></div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="e.g. My New User Onboarding guide isn't showing for anyone" />
    <button id="send">Send</button>
  </div>

<script>
const EXAMPLES = [
  "The guide page says 1,250 eligible visitors for New User Onboarding, so why does nobody see it?",
  "my onboarding guide isn't working",
  "why isn't Dashboards Launch Announcement showing to more people?",
  "how do I make a guide show only once per visitor?",
  "I want a refund for this month",
];

let sessionId = null;
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderExamples() {
  const box = document.getElementById("examples");
  EXAMPLES.forEach((text) => {
    const b = el("button", null, text.length > 46 ? text.slice(0, 46) + "…" : text);
    b.title = text;
    b.onclick = () => { inputEl.value = text; sendMessage(); };
    box.appendChild(b);
  });
}

function addUserMessage(text) {
  const wrap = el("div", "msg user");
  const bubble = el("div", "bubble", text);
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addThinking() {
  const wrap = el("div", "msg assistant");
  wrap.id = "thinking-placeholder";
  const bubble = el("div", "bubble thinking", "…thinking");
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeThinking() {
  const t = document.getElementById("thinking-placeholder");
  if (t) t.remove();
}

function addAssistantMessage(data) {
  const wrap = el("div", "msg assistant");
  const bubble = el("div", "bubble");

  const badge = el("span", "outcome-badge outcome-" + data.outcome, data.outcome.replace("_", " "));
  bubble.appendChild(badge);
  bubble.appendChild(document.createElement("br"));
  bubble.appendChild(document.createTextNode(data.message));

  if (data.evidence && data.evidence.length) {
    const details = el("details", "evidence");
    const summary = el("summary", null, `Evidence (${data.evidence.length})`);
    details.appendChild(summary);
    const ul = el("ul");
    data.evidence.forEach((e) => {
      const li = el("li", null, `${e.fact}  —  ${e.source}`);
      ul.appendChild(li);
    });
    details.appendChild(ul);
    bubble.appendChild(details);
  }

  if (data.caveats && data.caveats.filter(c => !c.startsWith("Internal:")).length) {
    const box = el("div", "caveats");
    const label = el("span", "label", "Data caveats");
    box.appendChild(label);
    data.caveats.filter(c => !c.startsWith("Internal:")).forEach((c) => {
      box.appendChild(el("div", null, "• " + c));
    });
    bubble.appendChild(box);
  }

  if (data.outcome === "escalate" && data.escalation_draft) {
    bubble.appendChild(renderEscalationCard(data.escalation_draft));
  }

  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderEscalationCard(draft) {
  const card = el("div", "escalation-card");
  card.appendChild(el("h4", null, "Escalation draft — the model prepared this, nothing was sent yet"));
  const dl = el("dl");
  const addField = (term, value) => {
    dl.appendChild(el("dt", null, term));
    dl.appendChild(el("dd", null, value || "—"));
  };
  addField("Summary", draft.summary);
  addField("Guide", draft.guide_id);
  addField("Checks already performed", (draft.checks_performed || []).join("; "));
  addField("What's unresolved", draft.unresolved_reason);
  card.appendChild(dl);

  const btn = el("button", null, "Confirm escalation → create ticket");
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = "Creating ticket…";
    try {
      const res = await fetch("/escalate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, escalation_draft: draft }),
      });
      const data = await res.json();
      const confirm = el("div", "ticket-confirm", `✓ ${data.ticket_id} created — a support engineer has everything above, the customer won't repeat it.`);
      card.appendChild(confirm);
      btn.remove();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Confirm escalation → create ticket (retry)";
    }
  };
  card.appendChild(btn);
  return card;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  sendBtn.disabled = true;
  addUserMessage(text);
  addThinking();
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) throw new Error("request failed: " + res.status);
    const data = await res.json();
    sessionId = data.session_id;
    removeThinking();
    addAssistantMessage(data);
  } catch (err) {
    removeThinking();
    const wrap = el("div", "msg assistant");
    const bubble = el("div", "bubble", "Something went wrong talking to the server: " + err.message);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = sendMessage;
inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
renderExamples();
inputEl.focus();
</script>
</body>
</html>
